# Schema for this config file: ProjectConfig in:
# https://luci-config.appspot.com/schemas/projects:luci-analysis.cfg

metrics {
  overrides {
    metric_id: "builds-with-flakes-in-presubmit"
    show_in_metrics_selector: true
    is_default: false
  }
  overrides {
    metric_id: "monitored-builds-with-test-run-failures"
    show_in_metrics_selector: true
    is_default: true
  }
  overrides {
    metric_id: "builds-failed-due-to-flaky-tests"
    show_in_metrics_selector: true
    is_default: true
  }
  overrides {
    metric_id: "human-cls-failed-presubmit"
    is_default: false
  }
  overrides {
    metric_id: "critical-failures-exonerated"
    is_default: false
  }
}

clustering {
  # Fuchsia Tests
  test_name_rules {
    name: "Fuchsia Tests"
    pattern: "fuchsia-pkg://fuchsia.com/(?P<package_name>([\\w.-]+))#meta/(?P<resource_path>([\\w.-]+)).cm([/:\\w.-])*"
    like_template: "fuchsia-pkg://fuchsia.com/${package_name}#meta/${resource_path}.cm%"
  }
}

bug_management {
  policies {
    id: "monitored-builder-failures"
    owners: "rvos-flakes@google.com"
    human_readable_name: "failures in CI"
    priority: P2
    metrics {
      metric_id: "monitored-builds-with-test-run-failures"
      activation_threshold {
        seven_day: 1
      }
      deactivation_threshold {
        seven_day: 1
      }
    }
    explanation {
      problem_html: "Failures have been detected on monitored builders."
      action_html: "Please investigate the failures and fix the underlying issue."
    }
    bug_template {
      comment_template: "This bug has been automatically filed/updated because failures were detected on monitored builders.\n\nNote: This bug will be automatically closed after 7 days without any new occurrences. If you would like to keep tracking this issue without it being automatically closed, please file a separate child bug.\n\nBugs are only routed to the 'Test Flakes' component if a more specific component could not be automatically determined from the test metadata."
      buganizer {
        hotlists: 8477814
      }
    }
  }
  default_bug_system: BUGANIZER
  buganizer {
    default_component {
      id: 1467263
    }
  }
}
